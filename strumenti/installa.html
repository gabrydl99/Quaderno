<style id="installa-css">
/* tasto "Installa" nella barra in alto: compare solo sul telefono e solo se l'app non è già installata */
.cerca-riga{display:flex;gap:8px;align-items:stretch}
.cerca-riga .search{flex:1;min-width:0}
.cerca-riga .inst{all:unset;box-sizing:border-box;flex:none;display:none;align-items:center;gap:6px;padding:0 12px 0 10px;border-radius:var(--r-md,12px);background:var(--blue);color:var(--sheet);font:600 .85rem/1 var(--f-body);cursor:pointer}
.cerca-riga .inst svg{color:inherit;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cerca-riga .inst:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
:root[data-installabile] .cerca-riga .inst{display:inline-flex}
.guida{position:fixed;z-index:60;left:0;right:0;bottom:0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--sheet);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(6,17,27,.25)}
.guida[hidden]{display:none!important}
.guida > div{max-width:560px;margin:0 auto}
.guida h2{margin:0 0 8px;font:700 1.15rem/1.3 var(--f-body);color:var(--ink)}
.guida ol{margin:0 0 14px;padding-left:1.3em;line-height:1.5}
.guida li{margin:4px 0}
.guida p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.guida .az{display:flex;gap:8px;flex-wrap:wrap}
.guida button{all:unset;box-sizing:border-box;cursor:pointer;padding:11px 16px;border-radius:999px;font:600 .92rem/1 var(--f-body);border:1px solid var(--line);color:var(--ink);background:var(--chip)}
.guida button.pri{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.guida button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
<div class="guida" id="guida" hidden role="dialog" aria-modal="false" aria-labelledby="guida-t"><div>
  <h2 id="guida-t">Installa il Quaderno</h2>
  <ol id="guida-passi"></ol>
  <p id="guida-nota"></p>
  <div class="az"><button type="button" class="pri" id="guida-copia">Copia l'indirizzo</button><button type="button" id="guida-chiudi">Chiudi</button></div>
</div></div>
<script>
/* tasto Installa: su Android apre la finestra di installazione di Chrome; su iPhone, o se il browser non la offre, spiega i passaggi */
(function(){
  const root = document.documentElement;
  const ua = navigator.userAgent;
  const installata = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /android/i.test(ua);
  const cerca = document.querySelector('.top .search');
  if (!cerca || installata) return;
  const riga = document.createElement('div'); riga.className = 'cerca-riga';
  cerca.parentNode.insertBefore(riga, cerca); riga.append(cerca);
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'inst'; b.title = "Installa l'app sul telefono";
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>Installa';
  riga.append(b);
  let richiesta = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); richiesta = e; root.dataset.installabile = ''; });
  addEventListener('appinstalled', () => { richiesta = null; delete root.dataset.installabile; chiudi(); });
  if (ios || android) root.dataset.installabile = '';

  const g = document.getElementById('guida'), passi = document.getElementById('guida-passi'), nota = document.getElementById('guida-nota');
  const copia = document.getElementById('guida-copia');
  function chiudi(){ g.hidden = true; b.focus(); }
  document.getElementById('guida-chiudi').addEventListener('click', chiudi);
  addEventListener('keydown', e => { if (e.key === 'Escape' && !g.hidden) chiudi(); });
  copia.addEventListener('click', () => {
    const fatto = () => { copia.textContent = 'Indirizzo copiato'; setTimeout(() => copia.textContent = "Copia l'indirizzo", 2000); };
    (navigator.clipboard ? navigator.clipboard.writeText(location.origin + location.pathname) : Promise.reject()).then(fatto, () => prompt("Copia l'indirizzo:", location.origin + location.pathname));
  });
  const safari = ios && /safari/i.test(ua) && !/crios|fxios|edgios|instagram|fban|fbav|line|gsa/i.test(ua);
  b.addEventListener('click', async () => {
    if (richiesta) {
      richiesta.prompt();
      const r = await richiesta.userChoice; richiesta = null;
      if (r.outcome === 'accepted') delete root.dataset.installabile;
      return;
    }
    if (ios) {
      passi.innerHTML = safari
        ? '<li>Tocca il tasto <b>Condividi</b> (il quadrato con la freccia in su), in basso o in alto.</li><li>Scorri e tocca <b>Aggiungi alla schermata Home</b>.</li><li>Tocca <b>Aggiungi</b>.</li>'
        : '<li>Copia l\'indirizzo con il tasto qui sotto.</li><li>Apri <b>Safari</b> e incollalo nella barra degli indirizzi.</li><li>In Safari tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>.</li>';
      nota.textContent = safari ? '' : 'Da questa finestra non si può installare: serve Safari.';
    } else {
      passi.innerHTML = '<li>Copia l\'indirizzo con il tasto qui sotto.</li><li>Apri <b>Chrome</b> e incollalo nella barra degli indirizzi.</li><li>Tocca il menu <b>⋮</b> in alto a destra e poi <b>Installa app</b> (o <b>Aggiungi a schermata Home</b>).</li>';
      nota.textContent = 'Se hai aperto il link da un\'altra app (Claude, WhatsApp, Telegram…) si apre una finestra interna che non permette di installare: per questo serve Chrome.';
    }
    g.hidden = false; copia.focus();
  });
})();
</script>
