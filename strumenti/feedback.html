<style id="feedback-css">
/* Segnalazioni e feedback: chi usa l'app può solo inviare; solo l'amministratore (con accesso) legge.
   La sicurezza la garantisce Supabase (regole sul database), non questa pagina. */
.fb{margin:12px 0 0;background:color-mix(in srgb,var(--sheet) 80%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r-lg,16px);overflow:hidden}
.fb-card,.fb-adm{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:10px 16px 11px}
.fb-card .n{display:block;font:700 1.05rem/1.25 var(--f-body);color:var(--ink)}
.fb-card .d{display:block;font-size:.84rem;line-height:1.35;color:var(--muted)}
.fb-adm{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);font:600 .88rem/1.2 var(--f-body);color:var(--ink);padding-block:10px}
.fb-adm .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:var(--acc);color:var(--on-acc,#fff);font:700 .78rem/22px var(--f-body);text-align:center}
.fb-adm.sa svg{color:var(--racing-bd)}
.fb-adm .cnt[hidden]{display:none}
.fb-card:focus-visible,.fb-adm:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.fb svg,.fbp svg,.adm svg,.segnala svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;color:inherit}

/* link in fondo a ogni argomento */
.segnala{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;margin:14px 0 -4px auto;width:max-content;cursor:pointer;padding:6px 8px;border-radius:8px;font:500 .8rem/1 var(--f-body);color:var(--muted)}
.segnala svg{width:15px;height:15px}
.segnala:hover,.segnala:focus-visible{color:var(--ink);background:var(--chip)}
.segnala:focus-visible{outline:2px solid var(--blue)}

/* pannello del modulo e area admin: a tutto schermo sul telefono */
.fbp,.adm{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fbp[hidden],.adm[hidden]{display:none!important}
.fbp-bar,.adm-bar{flex:none;display:flex;align-items:center;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.fbp-bar h2,.adm-bar h2{flex:1;min-width:0;margin:0;font:700 1.1rem/1.2 var(--f-body);color:var(--ink)}
.adm-bar h2 small{display:block;font:600 .72rem/1.2 var(--f-body);color:var(--blue)}
.x{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.x:focus-visible,.btn:focus-visible,.tipo label:focus-within,.adm-f button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fbp-body,.adm-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.fbp-in,.adm-in{max-width:620px;margin:0 auto}
.demo{margin:0 0 14px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--orange) 14%,var(--sheet));color:var(--ink);font-size:.84rem;line-height:1.4;border:1px solid color-mix(in srgb,var(--orange) 35%,var(--line))}
.fl{display:block;margin:0 0 6px;font:700 .9rem/1.3 var(--f-body);color:var(--ink)}
.fl small{font-weight:500;color:var(--muted)}
.campo{margin:0 0 16px}
.tipo{display:flex;flex-wrap:wrap;gap:6px}
fieldset.campo{border:0;padding:0;margin:0 0 16px;min-width:0}
fieldset.campo legend{padding:0}
.tipo label{position:relative;cursor:pointer}
.tipo input{position:absolute;opacity:0;pointer-events:none}
.tipo span{display:inline-block;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font:600 .86rem/1 var(--f-body);color:var(--ink)}
.tipo input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.in{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
textarea.in{min-height:150px;resize:vertical;line-height:1.5}
.aiuto{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:.8rem;color:var(--muted)}
.err{color:var(--red);font-weight:600}
.trappola{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.azioni{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;font:600 .95rem/1 var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.btn[disabled]{opacity:.5;cursor:default}
.privacy{margin:14px 0 0;font-size:.8rem;line-height:1.4;color:var(--muted)}
.esito{text-align:center;padding:36px 8px}
.esito .ok{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:color-mix(in srgb,var(--green) 16%,var(--sheet));color:var(--green)}
.esito .ok svg{width:32px;height:32px;stroke-width:2.6}
.esito h3{margin:0 0 6px;font:700 1.2rem/1.3 var(--f-body);color:var(--ink)}
.esito p{margin:0 auto 20px;max-width:34ch;color:var(--muted)}

/* area admin */
.adm-login{max-width:380px;margin:20px auto 0;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px}
.adm-login p{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.adm-f{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.adm-f button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font:600 .85rem/1 var(--f-body);color:var(--ink)}
.adm-f button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.adm-f .sp{flex:1}
.msg{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin:0 0 10px}
.msg.nuovo{border-left:4px solid var(--acc);padding-left:12px}
.msg-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.tag{display:inline-block;padding:4px 9px;border-radius:999px;font:700 .74rem/1 var(--f-body);background:var(--chip);color:var(--ink)}
.tag.t-errore{background:color-mix(in srgb,var(--red) 15%,var(--sheet));color:var(--red)}
.tag.t-suggerimento{background:color-mix(in srgb,var(--green) 15%,var(--sheet));color:var(--green)}
.tag.t-reclamo{background:color-mix(in srgb,var(--orange) 17%,var(--sheet));color:var(--orange)}
.msg-top time{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.msg-arg{all:unset;cursor:pointer;display:inline-block;margin:0 0 6px;font:600 .84rem/1.3 var(--f-body);color:var(--blue)}
.msg-arg:focus-visible{outline:2px solid var(--blue)}
.msg-arg.nolink{cursor:default;color:var(--muted)}
.msg-txt{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;color:var(--ink)}
.msg-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.msg-bot{justify-content:flex-end}
.msg-bot .chi{flex:1 1 100%;margin:0 0 2px}
.msg-bot button{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 10px;border-radius:8px;font:600 .8rem/1 var(--f-body);color:var(--ink);background:var(--chip)}
.msg-bot button.del{color:var(--red);background:transparent}
.msg-bot button.si{background:var(--red);color:#fff}
.msg-bot button:focus-visible{outline:2px solid var(--blue)}
.vuoto{text-align:center;color:var(--muted);padding:40px 10px}

/* area admin: utenti (admin: nome e foto; super-admin: tutto), accessi, segnalazioni */
.adm-bar h2 small.sa{display:block;width:max-content;margin-top:3px;padding:2px 8px;border-radius:999px;background:var(--racing);color:var(--on-racing);box-shadow:inset 0 0 0 1px var(--racing-bd)}
.adm-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;margin:0 0 14px;border-radius:999px;background:var(--chip)}
.adm-tabs button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:9px 4px;border-radius:999px;font:600 .86rem/1 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 4px rgba(6,17,27,.12)}
.adm-tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.adm-tabs .n{font-variant-numeric:tabular-nums}
.adm-nota{margin:0 0 12px;font-size:.8rem;line-height:1.4;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adm-nota .sp{flex:1}
.adm-nota button{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font:600 .82rem/1 var(--f-body);color:var(--ink)}
.adm-nota button:focus-visible{outline:2px solid var(--blue)}
.adm .av{position:relative;flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--muted);font:700 1.05rem/1 var(--f-body);text-transform:uppercase}
.adm .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;max-width:none}
.adm .av.sa{background:var(--racing);color:var(--on-racing);box-shadow:0 0 0 2px var(--racing)}
.adm .av.ad{background:var(--blue);color:var(--sheet)}
.adm .av .dot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid var(--sheet)}
.badge{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;font:700 .68rem/1 var(--f-body);vertical-align:2px;background:color-mix(in srgb,var(--blue) 14%,var(--sheet));color:var(--blue);white-space:nowrap}
.badge.sa{background:var(--racing);color:var(--on-racing);box-shadow:inset 0 0 0 1px var(--racing-bd)}
.ut{background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.ut.sa{border-color:var(--racing-bd)}
.ut-top{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px 6px}
.ut-top:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.ut-n b{font:700 1rem/1.25 var(--f-body);color:var(--ink);overflow-wrap:anywhere}
.ut-st{display:block;margin-top:3px;font-size:.8rem;line-height:1.3;color:var(--muted)}
.ut-st.on{color:var(--green);font-weight:600}
.ut-fr{color:var(--muted)}
.ut-fr svg{transition:transform .2s}
.ut-top[aria-expanded="true"] .ut-fr svg{transform:rotate(90deg)}
.ut-info{padding:0 14px 12px 70px;font-size:.8rem;line-height:1.45;color:var(--muted)}
.ut-info .disp{display:block;color:var(--ink);overflow-wrap:anywhere}
.ut-det{border-top:1px solid var(--line);padding:12px 14px 14px;background:color-mix(in srgb,var(--chip) 45%,var(--sheet))}
.ut-det[hidden]{display:none}
.ut-det h5{margin:0 0 8px;font:700 .84rem/1.2 var(--f-body);color:var(--ink)}
.reg{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.reg li{padding:8px 10px;border-radius:10px;background:var(--sheet);border:1px solid var(--line);font-size:.8rem;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.reg li b{color:var(--ink);font-weight:600}
.ip{font-family:var(--f-mono,monospace);font-size:.92em}
.ut-az{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ut-az .btn{min-height:38px;padding:0 14px;font-size:.86rem}
.ut-az .btn.del{color:var(--red);background:transparent;border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.ut-az .btn.rosso{background:var(--red);border-color:var(--red);color:#fff}
.ut-az .conf{flex-basis:100%;margin:0;font-size:.86rem;line-height:1.45;color:var(--ink)}
.ut-az .err{flex-basis:100%;margin:0;font-size:.84rem}
.ut-griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.ut-c{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;border-radius:14px;background:var(--sheet);border:1px solid var(--line);text-align:center;font:600 .86rem/1.25 var(--f-body);color:var(--ink);overflow-wrap:anywhere;min-width:0}
.ut-c .av{width:58px;height:58px;font-size:1.35rem}
.ac-riga{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;margin:0 0 8px;background:var(--sheet);border:1px solid var(--line);border-radius:12px}
.ac-riga .av{width:34px;height:34px;font-size:.85rem}
.ac-riga .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ac-riga .t b{color:var(--ink)}
.ac-riga .t time{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ac-riga .d{font-size:.8rem;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
/* termini di servizio, sotto "Segnalazioni e feedback" */
.tos{margin:10px 0 0}
.tos summary{display:flex;align-items:center;gap:6px;width:max-content;max-width:100%;box-sizing:border-box;cursor:pointer;list-style:none;padding:8px 14px 8px 10px;border-radius:999px;font:600 .82rem/1.2 var(--f-body);color:var(--ink);background:color-mix(in srgb,var(--sheet) 85%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line)}
.tos summary::-webkit-details-marker{display:none}
.tos summary svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tos[open] summary svg{transform:rotate(90deg)}
.tos summary:hover{background:var(--sheet)}
.tos summary:focus-visible{outline:2px solid var(--blue)}
.tos .tos-testo{margin:4px 0 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--sheet) 88%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.ut-fr svg,.tos summary svg{transition:none}}
body.fb-aperto{overflow:hidden}
@media (min-width:700px){
  .fbp{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,92vw);max-height:88vh;border-radius:18px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(6,17,27,.3);padding:0;overflow:hidden}
  .fbp-velo{position:fixed;inset:0;z-index:59;background:rgba(6,17,27,.42)}
}
.fbp-velo[hidden]{display:none}
@media (max-width:699.98px){.fbp-velo{display:none!important}}
</style>
<script>
(function(){
  /* collegamento a Supabase e accesso: vedi strumenti/account.html (va inserito prima di questo file) */
  const QP = window.QP;                               // accesso e collegamento: strumenti/account.html
  const CFG = QP.CFG, DEMO = QP.DEMO;
  const TIPI = [['errore', 'Errore negli appunti'], ['suggerimento', 'Suggerimento'], ['reclamo', 'Reclamo'], ['altro', 'Altro']];
  const NOME_TIPO = Object.fromEntries(TIPI);
  const MAX = 2000;
  const $ = (s, r) => (r || document).querySelector(s);
  const mem = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k){ try { localStorage.removeItem(k); } catch (e) {} }
  };
  const ver = (document.querySelector('.ver-fondo b') || {}).textContent || '';
  const ICO = {
    msg: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10.5H9l-5 4z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></svg>',
    flag: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4.5h11.5l-2.2 4 2.2 4H5"/></svg>',
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    ok: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    lock: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>'
  };

  /* ---------- servizio: Supabase vero oppure anteprima sul telefono ---------- */
  const H = QP.H;
  const DEMO_ESEMPI = [
    {id: -3, creato: new Date(Date.now() - 36e5 * 2).toISOString(), tipo: 'errore', argomento: 'Esempio · Stabilità › un argomento', rif: 'stabilita', messaggio: 'Messaggio di esempio: in questo argomento manca un pedice nella seconda formula.', nome: '', versione: ver, letto: false},
    {id: -2, creato: new Date(Date.now() - 36e5 * 26).toISOString(), tipo: 'suggerimento', argomento: '', rif: '', messaggio: 'Messaggio di esempio: sarebbe utile un quiz alla fine di ogni sezione.', nome: 'Nome di esempio', versione: ver, letto: false},
    {id: -1, creato: new Date(Date.now() - 36e5 * 70).toISOString(), tipo: 'reclamo', argomento: '', rif: '', messaggio: "Messaggio di esempio: un audio parte a volume basso.", nome: '', versione: ver, letto: true}
  ];
  const srv = {
    async invia(m){
      if (DEMO) { const l = mem.get('qp-demo-msg') || []; l.unshift({...m, id: Date.now(), creato: new Date().toISOString(), letto: false}); mem.set('qp-demo-msg', l); return; }
      const r = await fetch(CFG.url + '/rest/v1/segnalazioni', {method: 'POST', headers: {...H(), Prefer: 'return=minimal'}, body: JSON.stringify(m)});
      if (!r.ok) throw new Error('invio ' + r.status);
    },
    async elenco(){
      if (DEMO) return (mem.get('qp-demo-msg') || []).concat(DEMO_ESEMPI.map(e => ({...e, letto: (mem.get('qp-demo-letti') || {})[e.id] ?? e.letto}))).filter(e => !(mem.get('qp-demo-via') || []).includes(e.id));
      const r = await api('GET', '?select=*&order=creato.desc');
      return r.json();
    },
    async segna(id, letto){
      if (DEMO) { if (id < 0) { const s = mem.get('qp-demo-letti') || {}; s[id] = letto; mem.set('qp-demo-letti', s); } else { const l = mem.get('qp-demo-msg') || []; l.forEach(e => { if (e.id === id) e.letto = letto; }); mem.set('qp-demo-msg', l); } return; }
      await api('PATCH', '?id=eq.' + id, {letto});
    },
    async elimina(id){
      if (DEMO) { const v = mem.get('qp-demo-via') || []; v.push(id); mem.set('qp-demo-via', v); return; }
      await api('DELETE', '?id=eq.' + id);
    }
  };
  const api = (metodo, q, corpo) => QP.rest('segnalazioni', metodo, q, corpo);
  const admin = QP.superadmin;                        // le segnalazioni le legge solo il super-admin

  /* ---------- coda: se manca internet il messaggio parte dopo ---------- */
  async function svuota(){
    const coda = mem.get('qp-coda') || []; if (!coda.length || !navigator.onLine) return;
    const resto = [];
    for (const m of coda) { try { await srv.invia(m); } catch (e) { resto.push(m); } }
    mem.set('qp-coda', resto);
  }
  addEventListener('online', svuota); svuota();

  /* ---------- riquadro nella pagina iniziale ---------- */
  const cards = document.getElementById('cards');
  const box = document.createElement('section'); box.className = 'fb'; box.setAttribute('aria-label', 'Segnalazioni e feedback');
  box.innerHTML = '<button type="button" class="fb-card"><span class="n">Segnalazioni e feedback</span><span class="d">Errori negli appunti, suggerimenti o reclami: scrivili qui.</span></button>' +
    '<button type="button" class="fb-adm" hidden>' + ICO.lock + '<span>Area admin</span><span class="cnt" hidden></span></button>';
  if (cards) cards.after(box);
  /* termini di servizio: piccola sezione apribile subito sotto */
  const tos = document.createElement('details'); tos.className = 'tos'; tos.id = 'termini';
  tos.innerHTML = '<summary><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>Termini di servizio e privacy</summary>' + QP.TERMINI;
  box.after(tos);
  $('.fb-card', box).addEventListener('click', () => apriModulo(''));
  const admBtn = $('.fb-adm', box);
  admBtn.addEventListener('click', () => { location.hash = 'admin'; });
  async function conta(){
    admBtn.hidden = !QP.admin();
    admBtn.classList.toggle('sa', QP.superadmin());
    $('span', admBtn).textContent = QP.superadmin() ? 'Area super-admin' : 'Area admin';
    if (!admin()) { QP.nuove = 0; $('.cnt', admBtn).hidden = true; return; }
    try {

      $('.av-p', r).replaceWith(av(u));
      $('b', r).textContent = x.nome; $('time', r).textContent = periodo(x); $('time', r).dateTime = x.inizio;
      $('.d', r).innerHTML = esc(dispTesto(x)) + (x.ip ? ' · IP <span class="ip">' + esc(x.ip) + '</span>' : '');
      L.append(r);
    });
  }
  /* segnalazioni (solo super-admin) */
  function disegnaSegnalazioni(C){
    const nuove = lista.filter(m => !m.letto).length;
    const vis = filtro === 'nuove' ? lista.filter(m => !m.letto) : lista;
    C.innerHTML = '<div class="adm-f" role="group" aria-label="Filtro"><button type="button" data-f="nuove" aria-pressed="' + (filtro === 'nuove') + '">Da leggere (' + nuove + ')</button>' +
      '<button type="button" data-f="tutte" aria-pressed="' + (filtro === 'tutte') + '">Tutte (' + lista.length + ')</button><span class="sp"></span><button type="button" class="agg">Aggiorna</button></div><div class="lista"></div>';
    C.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { filtro = b.dataset.f; disegnaAdmin(); }));
    $('.agg', C).addEventListener('click', () => mostraAdmin());
    const L = $('.lista', C);
    if (!vis.length) { L.innerHTML = '<p class="vuoto">' + (filtro === 'nuove' ? 'Nessuna segnalazione da leggere.' : 'Ancora nessuna segnalazione.') + '</p>'; return; }
    vis.forEach(m => {
      const c = document.createElement('article'); c.className = 'msg' + (m.letto ? '' : ' nuovo');
      c.innerHTML = '<div class="msg-top"><span class="tag"></span><time></time></div><button type="button" class="msg-arg"></button><p class="msg-txt"></p>' +
        '<div class="msg-bot"><span class="chi"></span><button type="button" class="tl"></button><button type="button" class="del">Elimina</button></div>';
      const tag = $('.tag', c); tag.textContent = NOME_TIPO[m.tipo] || 'Altro'; tag.classList.add('t-' + (m.tipo || 'altro'));
      $('time', c).textContent = dataIt(m.creato); $('time', c).dateTime = m.creato;
      const ar = $('.msg-arg', c);
      if (m.argomento) { ar.textContent = m.argomento; if (m.rif && document.getElementById(m.rif)) ar.addEventListener('click', () => { location.hash = m.rif; }); else ar.classList.add('nolink'); } else ar.remove();
      $('.msg-txt', c).textContent = m.messaggio;
      $('.chi', c).textContent = (m.nome ? 'da ' + m.nome : 'anonimo') + (m.versione ? ' · ' + m.versione : '');
      const tl = $('.tl', c); tl.textContent = m.letto ? 'Segna da leggere' : 'Segna come letta';
      tl.addEventListener('click', async () => { try { await srv.segna(m.id, !m.letto); m.letto = !m.letto; disegnaAdmin(); conta(); } catch (x) {} });
      const del = $('.del', c);
      del.addEventListener('click', () => {
        const bot = $('.msg-bot', c);
        bot.innerHTML = '<span class="chi">Eliminare questa segnalazione?</span><button type="button" class="si">Elimina</button><button type="button" class="no">Annulla</button>';
        $('.no', bot).addEventListener('click', () => disegnaAdmin());
        $('.si', bot).addEventListener('click', async () => { try { await srv.elimina(m.id); lista = lista.filter(x => x !== m); disegnaAdmin(); conta(); } catch (x) {} });
        $('.no', bot).focus();
      });
      L.append(c);
    });
  }
  function ferma(){ clearInterval(giro); giro = null; }
  function rotta(){
    const on = location.hash === '#admin';
    if (on && A.hidden) {
      A.hidden = false; document.body.classList.add('fb-aperto'); scheda = 'utenti'; aperto = null; mostraAdmin(); $('.chiudi', A).focus();
      ferma(); giro = setInterval(() => { if (!document.hidden && scheda === 'utenti' && QP.superadmin()) mostraAdmin(true); }, 30000);
    }
    else if (!on && !A.hidden) { A.hidden = true; ferma(); document.body.classList.remove('fb-aperto'); conta(); }
  }
  addEventListener('hashchange', rotta); rotta();
  QP.on(() => { if (!A.hidden) mostraAdmin(true); });
})();
</script>
