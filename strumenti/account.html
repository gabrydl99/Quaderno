<style id="account-css">
/* Profilo: accesso con nome utente e password, argomenti segnati come letti, progressi per capitolo.
   I dati di ognuno li può leggere solo il proprietario (regole sul database Supabase). */
.cerca-riga{display:flex;gap:8px;align-items:stretch}
.cerca-riga .search{flex:1;min-width:0}
.acc-chip{all:unset;box-sizing:border-box;flex:none;display:inline-flex;align-items:center;gap:6px;max-width:42%;padding:0 11px 0 5px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);font:600 .86rem/1 var(--f-body);cursor:pointer}
.acc-chip .av,.acc .av{flex:none;display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:var(--chip);color:var(--muted);font:700 .8rem/1 var(--f-body);text-transform:uppercase}
.acc-chip .av svg{width:16px;height:16px}
.acc-chip.in .av,.acc .av.in{background:var(--blue);color:var(--sheet)}
.acc-chip.ad .av,.acc .av.ad{background:var(--blue);color:var(--sheet)}
/* foto profilo e super-admin (giallo racing) */
.acc-chip .av,.acc .av{position:relative;overflow:hidden}
.acc-chip .av img,.acc .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.acc .av.io{background:var(--blue);color:var(--sheet)}
.acc-chip.sa{border-color:var(--racing-bd)}
.acc-chip.sa .av,.acc .av.sa{background:var(--racing);color:var(--on-racing);box-shadow:0 0 0 2px var(--racing)}
.acc-chip .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.acc svg,.acc-chip svg,.letto svg,.toc .tk svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:inherit}

/* barra di avanzamento */
.bar{display:block;height:8px;border-radius:99px;background:color-mix(in srgb,var(--blue) 14%,var(--sheet));overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--blue);transition:width .35s ease}
.bar.ok i{background:var(--green)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* in fondo a ogni argomento: "Segna come letto" (e "Segnala un errore") */
.art-fondo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 0 -4px;padding-top:12px;border-top:1px solid var(--line)}
.art-fondo .segnala{margin:0}
.art-fondo.solo-segnala{justify-content:flex-end}
.letto{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px 0 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);font:600 .9rem/1 var(--f-body)}
.letto .ck{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);box-sizing:border-box}
.letto .ck svg{width:14px;height:14px;stroke-width:3;opacity:0}
.letto.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 13%,var(--sheet));color:var(--green)}
.letto.on .ck{border-color:var(--green);background:var(--green);color:var(--sheet)}
.letto.on .ck svg{opacity:1}
.letto:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toc a .tk{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--green);color:var(--sheet)}
.toc a .tk svg{width:11px;height:11px;stroke-width:3.4}

/* pagina iniziale: avanzamento sotto ogni capitolo */
#cards .card.con-pr{grid-template-areas:"n ill" "m ill" "d d" "p p"}
#cards .card .pr{grid-area:p;display:flex;align-items:center;gap:10px;margin-top:8px}
#cards .card .pr .bar{flex:1}
#cards .card .pr-n{font:600 .78rem/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* pannello Profilo */
.acc{position:fixed;inset:0;z-index:58;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.acc[hidden]{display:none!important}
.acc-bar{flex:none;display:flex;align-items:center;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.acc-bar h2{flex:1;min-width:0;margin:0;font:700 1.1rem/1.2 var(--f-body);color:var(--ink)}
.acc-bar .x{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.acc-bar .x svg{width:18px;height:18px}
.acc-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.acc-in{max-width:560px;margin:0 auto}
.acc .demo{margin:0 0 14px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--orange) 14%,var(--sheet));color:var(--ink);font-size:.84rem;line-height:1.4;border:1px solid color-mix(in srgb,var(--orange) 35%,var(--line))}
.acc .avviso{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--blue) 10%,var(--sheet));border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));font-size:.9rem;color:var(--ink)}
.acc-intro{margin:0 0 14px;color:var(--muted);line-height:1.45}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 16px;border-radius:999px;background:var(--chip)}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:10px 8px;border-radius:999px;font:600 .92rem/1 var(--f-body);color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 4px rgba(6,17,27,.12)}

.acc form{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px}
.acc .campo{margin:0 0 14px}
.acc .fl{display:block;margin:0 0 6px;font:700 .9rem/1.3 var(--f-body);color:var(--ink)}
.acc .in{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.acc .in:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.acc .aiuto{margin:5px 0 0;font-size:.8rem;color:var(--muted)}
.acc .err{min-height:1.2em;margin:0 0 10px;color:var(--red);font-weight:600;font-size:.88rem}
.acc .btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font:600 .95rem/1 var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.acc .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.acc .btn.largo{width:100%}
.acc .btn[disabled]{opacity:.5;cursor:default}
.acc .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.acc .nota{margin:14px 2px 0;font-size:.82rem;line-height:1.45;color:var(--muted)}
.ciao{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.ciao .av{width:52px;height:52px;font-size:1.3rem}
.ciao h3{margin:0;font:700 1.3rem/1.2 var(--f-body);color:var(--ink)}
.ciao p{margin:3px 0 0;font-size:.86rem;color:var(--muted)}
.ciao .ruolo{display:inline-block;margin-left:6px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,var(--sheet));color:var(--blue);font:700 .72rem/1 var(--f-body);vertical-align:2px}
.ciao .ruolo.sa{background:var(--racing);color:var(--on-racing);box-shadow:inset 0 0 0 1px var(--racing-bd)}
.foto-az{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px}
.foto-az button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px 0 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);font:600 .82rem/1 var(--f-body)}
.foto-az button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foto-az button.via{color:var(--red)}
.foto-az button[disabled]{opacity:.5;cursor:default}
.foto-az button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.foto-az .err{flex-basis:100%;min-height:0;margin:2px 2px 0}
/* termini di servizio (testo in comune tra pagina iniziale e registrazione) */
.tos-testo{font-size:.82rem;line-height:1.45;color:var(--muted)}
.tos-testo ul{margin:0;padding:0 0 0 18px;display:grid;gap:5px}
.tos-testo b{color:var(--ink);font-weight:600}
.tos-testo p{margin:8px 0 0;font-size:.76rem}
.tos-reg{margin:12px 2px 0;font-size:.82rem;color:var(--muted)}
.tos-reg summary{cursor:pointer;line-height:1.4}
.tos-reg summary u{color:var(--blue);text-underline-offset:2px}
.tos-reg .tos-testo{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--sheet);border:1px solid var(--line)}
.tot{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 18px}
.tot-n{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.tot-n b{font:700 2.1rem/1 var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.tot-n span{color:var(--muted);font-size:.9rem}
.tot .bar{height:12px}
.acc h4{margin:0 0 8px;font:700 1rem/1.3 var(--f-body);color:var(--ink)}
.cap{list-style:none;margin:0 0 18px;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cap > li + li{border-top:1px solid var(--line)}
.cap button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;width:100%;padding:12px 16px}
.cap button:hover{background:color-mix(in srgb,var(--blue) 4%,var(--sheet))}
.cap button:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.cap .c-t{font:700 1rem/1.25 var(--f-body);color:var(--ink)}
.cap .c-n{font:600 .82rem/1.25 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cap .c-n.ok{color:var(--green)}
.cap .bar{grid-column:1/-1}
.cap .sub{list-style:none;margin:0;padding:0 0 6px}
.cap .sub button{padding:7px 16px 7px 30px}
.cap .sub .c-t{font-weight:600;font-size:.88rem}
.cap .sub .bar{height:5px}
.adm-box{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 18px}
.adm-box p{flex:1;margin:0;font-size:.88rem;color:var(--muted)}
.adm-box p b{display:block;color:var(--ink);font-size:.95rem}
.adm-box .btn{min-height:40px;padding:0 16px;background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.adm-box.sa{border-color:var(--racing-bd);background:color-mix(in srgb,var(--racing) 12%,var(--sheet))}
.acc .esci{margin-top:4px}
.acc .elimina{all:unset;box-sizing:border-box;display:block;margin:16px auto 0;padding:9px 14px;border-radius:10px;cursor:pointer;font:600 .86rem/1 var(--f-body);color:var(--red);text-align:center}
.acc .elimina:hover,.acc .elimina:focus-visible{background:color-mix(in srgb,var(--red) 10%,var(--sheet))}
.acc .elimina:focus-visible{outline:2px solid var(--red)}
.del-box{margin:14px 0 0;padding:14px 16px;border-radius:16px;border:1.5px solid var(--red);background:color-mix(in srgb,var(--red) 8%,var(--sheet))}
.del-box[hidden]{display:none}
.del-box h4{margin:0 0 6px;color:var(--red)}
.del-box p{margin:0 0 12px;font-size:.9rem;line-height:1.45;color:var(--ink)}
.del-box .azioni{display:flex;gap:8px;flex-wrap:wrap}
.acc .btn.rosso{background:var(--red);border-color:var(--red);color:var(--sheet)}
body.acc-aperto{overflow:hidden}

.gate .aiuto{margin:5px 0 0;font-size:.8rem;color:var(--muted)}
.gate .err{min-height:1.2em;margin:0 0 10px;color:var(--red);font-weight:600;font-size:.88rem}
.gate .btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:999px;font:600 1rem/1 var(--f-body);background:var(--ink);color:var(--sheet)}
.gate .btn[disabled]{opacity:.5;cursor:default}
.gate .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.gate .nota{margin:14px 4px 0;font-size:.84rem;line-height:1.45;color:var(--muted)}
.gate .avviso{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--blue) 10%,var(--sheet));border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));font-size:.9rem;color:var(--ink)}
.gate .demo{margin:0 0 14px;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--orange) 14%,var(--sheet));color:var(--ink);font-size:.84rem;line-height:1.4;border:1px solid color-mix(in srgb,var(--orange) 35%,var(--line))}

</style>

  const subs = [];
  function daRisposta(j){
    const u = j.user || {}, md = u.user_metadata || {}, am = u.app_metadata || {};

      id: u.id, nome: md.nome || (u.email || '').split('@')[0], ruolo: am.ruolo || ''};
    mem.set('qp-sessione', s); return s;
  }
  async function token(){
    const s = sess(); if (!s) throw new Error('fuori');
    if (s.demo || s.scade > Date.now()) return s.access;
    const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', {method: 'POST', headers: H(), body: JSON.stringify({refresh_token: s.refresh})});
    if (r.status === 400 || r.status === 401) { mem.del('qp-sessione'); emetti(); throw new Error('fuori'); }
    if (!r.ok) throw new Error('rete');

  }
  async function rest(tab, metodo, q, corpo, prefer){
    const r = await fetch(CFG.url + '/rest/v1/' + tab + (q || ''), {method: metodo, headers: Object.assign(H(await token()), {Prefer: prefer || 'return=minimal'}), body: corpo ? JSON.stringify(corpo) : undefined});
    if (r.status === 401) { mem.del('qp-sessione'); emetti(); throw new Error('fuori'); }
    if (!r.ok) throw new Error(metodo + ' ' + r.status);

  }
  const errore = (j, def) => {
    const c = (j && (j.error_code || j.code || j.error)) || '', m = ((j && (j.msg || j.message || j.error_description)) || '').toLowerCase();
    if (c === 'user_already_exists' || m.includes('already registered')) return 'Questo nome utente è già preso: scegline un altro.';
    if (c === 'weak_password' || m.includes('password should')) return 'Password troppo corta: usa almeno 6 caratteri.';
    if (c === 'signup_disabled' || m.includes('signups not allowed')) return 'Le registrazioni sono chiuse in questo momento.';
    if (c === 'invalid_credentials' || m.includes('invalid login')) return 'Nome utente o password sbagliati.';
    if (c === 'over_request_rate_limit' || c === 'over_email_send_rate_limit') return 'Troppi tentativi: riprova tra qualche minuto.';
    if (m.includes('database error saving new user')) return 'Codice d\'accesso sbagliato: chiedi quello giusto a un amministratore.';

  async function entra(nome, pw){

    if (!navigator.onLine) throw new Error('Serve internet per entrare.');
    let r; try { r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', {method: 'POST', headers: H(), body: JSON.stringify({email: nome.toLowerCase() + '@' + DOMINIO, password: pw})}); } catch (e) { throw new Error(RETE); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(errore(j, 'Nome utente o password sbagliati.'));
    daRisposta(j); await prog.scarica(); emetti(); battito.avvia();
  }
  async function registra(nome, pw, codice){
    nome = nome.trim(); codice = (codice || '').trim();
    if (!NOME_OK.test(nome)) throw new Error('Il nome utente deve avere da 3 a 20 caratteri: lettere, numeri, punto, trattino o trattino basso.');
    if (pw.length < 6) throw new Error('Password troppo corta: usa almeno 6 caratteri.');
    if (!codice) throw new Error('Scrivi il codice d\'accesso: te lo dà un amministratore.');
    if (DEMO && codice.toLowerCase() !== CODICE_DEMO().toLowerCase()) throw new Error('Codice d\'accesso sbagliato: chiedi quello giusto a un amministratore.');
    if (DEMO) { const n = mem.get('qp-demo-nomi') || {}; if (n[nome.toLowerCase()]) throw new Error('Questo nome utente è già preso: scegline un altro.'); n[nome.toLowerCase()] = nome; mem.set('qp-demo-nomi', n); return entra(nome, pw); }
    if (!navigator.onLine) throw new Error('Serve internet per registrarti.');
    let r; try { r = await fetch(CFG.url + '/auth/v1/signup', {method: 'POST', headers: H(), body: JSON.stringify({email: nome.toLowerCase() + '@' + DOMINIO, password: pw, data: {nome, codice}})}); } catch (e) { throw new Error(RETE); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(errore(j, 'Registrazione non riuscita: riprova.'));
    if (!j.access_token) throw new Error('Registrazione ricevuta, ma l\'accesso non è ancora attivo: avvisa l\'amministratore.');
    daRisposta(j); await prog.scarica(); emetti(); battito.avvia();
  }
  function avvia(s){ mem.set('qp-sessione', s); prog.leggi(); emetti(); }
  /* elimina per sempre l'account e i suoi progressi (funzione elimina_account sul database) */

      if (!r.ok) throw new Error('Non sono riuscito a eliminare l\'account: riprova più tardi.');
    }
    const k = prog.k(); if (k) { mem.del(k); mem.del(k + '-coda'); }

    if (s.demo) { const n = mem.get('qp-demo-nomi') || {}; delete n[s.nome.toLowerCase()]; mem.set('qp-demo-nomi', n); }

  /* ---------- rpc sul database (funzioni che controllano chi le chiama) ---------- */
  async function rpc(nome, corpo){
    const r = await fetch(CFG.url + '/rest/v1/rpc/' + nome, {method: 'POST', headers: H(await token()), body: JSON.stringify(corpo || {})});
    if (r.status === 401) { mem.del('qp-sessione'); emetti(); throw new Error('fuori'); }
    const j = await r.json().catch(() => null);

    return j;
  }

  /* ---------- dispositivo: modello (se il telefono lo comunica), sistema e browser ---------- */
  async function dispositivo(){
    const ua = navigator.userAgent || '';
    let modello = '', sistema = '', browser = '', m;
    const ipad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if ((m = ua.match(/Android\s([\d.]+)/))) sistema = 'Android ' + m[1];
    else if (/iPhone|iPod/.test(ua) || ipad) { m = ua.match(/OS (\d+)[._](\d+)/) || ua.match(/Version\/(\d+)\.(\d+)/); sistema = (ipad ? 'iPadOS ' : 'iOS ') + (m ? m[1] + '.' + m[2] : ''); modello = ipad ? 'iPad' : 'iPhone'; }
    else if (/Windows/.test(ua)) sistema = 'Windows';
    else if (/CrOS/.test(ua)) sistema = 'ChromeOS';
    else if (/Mac OS X/.test(ua)) sistema = 'macOS';
    else if (/Linux/.test(ua)) sistema = 'Linux';
    if ((m = ua.match(/EdgA?\/(\d+)/))) browser = 'Edge ' + m[1];
    else if ((m = ua.match(/SamsungBrowser\/(\d+)/))) browser = 'Samsung Internet ' + m[1];
    else if ((m = ua.match(/OPR\/(\d+)/))) browser = 'Opera ' + m[1];
    else if ((m = ua.match(/(?:Firefox|FxiOS)\/(\d+)/))) browser = 'Firefox ' + m[1];
    else if ((m = ua.match(/CriOS\/(\d+)/))) browser = 'Chrome ' + m[1];
    else if ((m = ua.match(/Chrome\/(\d+)/))) browser = 'Chrome ' + m[1];
    else if ((m = ua.match(/Version\/([\d]+(?:\.\d+)?).*Safari/))) browser = 'Safari ' + m[1];
    const uad = navigator.userAgentData;
    if (uad && uad.getHighEntropyValues) {
      try {
        const h = await uad.getHighEntropyValues(['model', 'platformVersion']);
        if (h.model) modello = h.model;
        if (h.platform === 'Android' && h.platformVersion) sistema = 'Android ' + h.platformVersion.split('.')[0];
        if (h.platform === 'Windows' && h.platformVersion) sistema = parseInt(h.platformVersion, 10) >= 13 ? 'Windows 11' : 'Windows 10';
      } catch (e) {}
    }
    if (!modello && (m = ua.match(/Android [\d.]+; ([^;)]+)\)/)) && m[1] !== 'K') modello = m[1].replace(/\s*Build\/.*$/, '').trim();
    if (matchMedia('(display-mode: standalone)').matches) browser += (browser ? ' · ' : '') + 'app installata';
    return {modello: modello.slice(0, 60), sistema: sistema.slice(0, 40), browser: browser.slice(0, 40)};
  }

  /* ---------- segnale: "in linea" e registro degli accessi (solo con l'account, ogni minuto mentre l'app è aperta) ---------- */
  const battito = {
    t: null, disp: null, prima: true,
    async invia(){
      const s = sess(); if (!s || DEMO || s.demo || !navigator.onLine || document.hidden) return;
      try {
        if (!this.disp) this.disp = await dispositivo();
        const prima = this.prima;
        const j = await rpc('segnale', {d: Object.assign({}, this.disp, prima ? {foto: '1'} : {})});
        this.prima = false;
        const s2 = sess(); if (!s2 || !j) return;
        let cambia = false;
        if ((j.ruolo || '') !== ruoloDi(s2)) { s2.ruolo = j.ruolo || ''; delete s2.admin; mem.set('qp-sessione', s2); cambia = true; }
        if (prima && 'foto' in j && (j.foto || null) !== foto.mia()) { foto.metti(j.foto || null); cambia = true; }
        if (cambia) emetti();
      } catch (e) {}
    },
    avvia(){ this.ferma(); if (!sess() || DEMO) return; this.prima = true; this.invia(); this.t = setInterval(() => this.invia(), 60000); },
    ferma(){ clearInterval(this.t); this.t = null; }
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && battito.t) battito.invia(); });

  /* ---------- foto del profilo: ridotta sul telefono (192 px, ~15 KB) prima di salvarla ---------- */
  const foto = {
    mia(){ const s = sess(); return s ? mem.get('qp-foto-' + s.id) : null; },
    metti(d){ const s = sess(); if (!s) return; d ? mem.set('qp-foto-' + s.id, d) : mem.del('qp-foto-' + s.id); },
    riduci(file){
      return new Promise((ok, no) => {
        const u = URL.createObjectURL(file), im = new Image();
        im.onload = () => {
          const L = 192, c = document.createElement('canvas'); c.width = c.height = L;
          const x = c.getContext('2d'), w = im.naturalWidth, h = im.naturalHeight, lato = Math.min(w, h);
          x.fillStyle = '#ffffff'; x.fillRect(0, 0, L, L);
          x.drawImage(im, (w - lato) / 2, (h - lato) / 2, lato, lato, 0, 0, L, L);
          URL.revokeObjectURL(u);
          let q = .85, d = c.toDataURL('image/webp', q); const tipo = d.startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
          if (tipo === 'image/jpeg') d = c.toDataURL(tipo, q);
          while (d.length > 55000 && q > .4) { q -= .15; d = c.toDataURL(tipo, q); }
          d.length > 60000 ? no(new Error('Foto troppo pesante: prova con un\'altra.')) : ok(d);
        };
        im.onerror = () => { URL.revokeObjectURL(u); no(new Error('Non riesco ad aprire questa immagine.')); };
        im.src = u;
      });
    },
    async salva(d){
      const s = sess(); if (!s) return;
      if (!DEMO && !s.demo) {
        if (!navigator.onLine) throw new Error('Serve internet per cambiare la foto.');
        await rpc('salva_foto', {foto: d});
      }
      this.metti(d); emetti();
    }
  };
  /* avatar: foto se c'è, altrimenti l'iniziale del nome */

    else el.textContent = (nome || '?').charAt(0);

  /* ---------- argomenti letti ---------- */
  const prog = {
    fatti: new Set(),
    k(){ const s = sess(); return s ? 'qp-prog-' + s.id : null; },
    leggi(){ const k = this.k(); this.fatti = new Set(k ? (mem.get(k) || []) : []); },
    salva(){ const k = this.k(); if (k) mem.set(k, [...this.fatti]); },
    async segna(id, si){
      if (!sess()) return;
      si ? this.fatti.add(id) : this.fatti.delete(id); this.salva(); emetti();
      if (DEMO) return;
      const ck = this.k() + '-coda', coda = (mem.get(ck) || []).filter(o => o.a !== id); coda.push({a: id, si}); mem.set(ck, coda);
      this.invia();
    },
    async invia(){

  /* ---------- capitoli e argomenti della pagina ---------- */

  })).filter(s => s.art.length && !NO_PROG.includes(s.id));
  const TUTTI = SEZ.flatMap(s => s.art);
  const conta = ids => { let n = 0; ids.forEach(i => { if (prog.fatti.has(i)) n++; }); return n; };
  const pc = (n, t) => t ? Math.round(n / t * 100) : 0;

  /* ---------- pannello Profilo (#profilo) ---------- */

      '<div class="tot"><div class="tot-n"><b>' + p + '%</b><span>' + n + ' argomenti letti su ' + t + '</span></div><span class="bar' + (p === 100 ? ' ok' : '') + '" role="progressbar" aria-label="Avanzamento totale" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p + '"><i style="width:' + p + '%"></i></span></div>' +
      (r === 'superadmin' ? '<div class="adm-box sa"><p><b>Area super-admin</b>Utenti, accessi, segnalazioni e codice' + (window.QP.nuove ? ' · ' + window.QP.nuove + ' da leggere' : '') + '</p><button type="button" class="btn adm-go">Apri</button></div>' :
       r === 'admin' ? '<div class="adm-box"><p><b>Area admin</b>Utenti registrati e codice d\'accesso</p><button type="button" class="btn adm-go">Apri</button></div>' : '') +
      '<h4>Capitoli</h4><ul class="cap"></ul>' +

        '<div class="del-box" id="del-box" hidden><h4>Eliminare l\'account?</h4><p>L\'account <b class="del-nome"></b> e tutti i tuoi progressi verranno cancellati <b>per sempre</b>: non si può annullare. Le segnalazioni che hai già inviato restano.</p>' +
        '<p class="err" role="alert"></p><div class="azioni"><button type="button" class="btn rosso del-si">Elimina definitivamente</button><button type="button" class="btn del-no">Annulla</button></div></div>');

    if (r) { const b = document.createElement('span'); b.className = 'ruolo' + (r === 'superadmin' ? ' sa' : ''); b.textContent = NOME_RUOLO[r] || r; $('.ciao h3', PI).append(b); }

      catch (x) { fe.textContent = x.message === 'fuori' ? 'Accesso scaduto: rientra e riprova.' : (x.message || 'Non sono riuscito a salvare la foto.'); fa.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
    }));

    const L = $('.cap', PI);

    const el = $('.elimina', PI), db = $('#del-box', PI);

      el.addEventListener('click', () => { db.hidden = false; el.hidden = true; el.setAttribute('aria-expanded', 'true'); db.scrollIntoView({block: 'nearest'}); $('.del-no', db).focus(); });
      $('.del-no', db).addEventListener('click', () => { db.hidden = true; el.hidden = false; el.setAttribute('aria-expanded', 'false'); el.focus(); });
      $('.del-si', db).addEventListener('click', async () => {
        const b = $('.del-si', db), e = $('.err', db); b.disabled = true; b.textContent = 'Elimino…'; e.textContent = '';
        try { scheda = 'entra'; await eliminaAccount(); avviso = 'Account eliminato.'; disegnaGate(); }
        catch (x) { e.textContent = x.message; b.disabled = false; b.textContent = 'Elimina definitivamente'; }
      });
    }
    const ag = $('.adm-go', PI); if (ag) ag.addEventListener('click', () => { location.hash = 'admin'; });
  }
  function riga_(nome, ids, vai){
    const n = conta(ids), t = ids.length, p = pc(n, t);
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<span class="c-t"></span><span class="c-n' + (p === 100 ? ' ok' : '') + '">' + (p === 100 ? 'Completato · ' : '') + n + '/' + t + ' · ' + p + '%</span><span class="bar' + (p === 100 ? ' ok' : '') + '"><i style="width:' + p + '%"></i></span>';
    $('.c-t', b).textContent = nome; b.setAttribute('aria-label', nome + ': ' + n + ' argomenti letti su ' + t + ', ' + p + ' per cento');
    b.addEventListener('click', vai); return b;
  }
  /* ---------- schermata d'accesso (prima pagina se non sei entrato) ---------- */
  const GT = document.createElement('div'); GT.className = 'gate'; GT.id = 'qp-accesso'; GT.hidden = true;
  GT.setAttribute('role', 'dialog'); GT.setAttribute('aria-modal', 'true'); GT.setAttribute('aria-labelledby', 'gate-t');
  document.body.append(GT);
  /* campo password con l'occhio per vedere cosa hai scritto */
  const campoPw = (id, etich, ac, aiuto) => '<div class="campo"><label class="fl" for="' + id + '">' + etich + '</label><div class="pw"><input class="in" id="' + id + '" type="password" autocomplete="' + ac + '" autocapitalize="none" autocorrect="off" spellcheck="false" required>' +
    '<button type="button" class="occhio" aria-controls="' + id + '" aria-pressed="false" aria-label="Mostra la password" title="Mostra la password">' + ICO.occhio + '</button></div>' + (aiuto ? '<p class="aiuto">' + aiuto + '</p>' : '') + '</div>';
  function collegaOcchi(r){
    r.querySelectorAll('.occhio').forEach(b => {
      const inp = document.getElementById(b.getAttribute('aria-controls'));
      b.addEventListener('pointerdown', e => e.preventDefault());      // la tastiera resta aperta sul campo
      b.addEventListener('click', () => {
        const vedi = inp.type === 'password'; inp.type = vedi ? 'text' : 'password';
        b.setAttribute('aria-pressed', vedi); b.innerHTML = vedi ? ICO.occhioNo : ICO.occhio;
        const t = vedi ? 'Nascondi la password' : 'Mostra la password'; b.setAttribute('aria-label', t); b.title = t;
      });
    });
  }
  function disegnaGate(){
    const reg = scheda === 'registrati';
    GT.innerHTML = '<div class="gate-in">' +
      '<div class="gate-testa"><img src="icons/icon-192.png" alt=""><h1 id="gate-t">Quaderno <span>Patentino</span></h1></div>' +
      '<p class="gate-sub">Appunti, disegni e audio delle lezioni per il patentino nautico. Entra con il tuo account.</p>' +
      (DEMO ? '<p class="demo"><b>Anteprima</b>: va bene qualsiasi nome e password (con <b>Gabrydl</b> sei super-admin, con un nome che inizia per <b>admin</b> sei admin). Codice: <b>' + CODICE_DEMO().replace(/[<>&"]/g, '') + '</b>.</p>' : '') +
      (avviso ? '<p class="avviso"></p>' : '') +
      '<div class="seg" role="tablist" aria-label="Accesso"><button type="button" role="tab" data-s="entra" aria-selected="' + !reg + '">Entra</button><button type="button" role="tab" data-s="registrati" aria-selected="' + reg + '">Registrati</button></div>' +
      '<form novalidate>' +
      '<div class="campo"><label class="fl" for="acc-u">Nome utente</label><input class="in" id="acc-u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" required>' +
      (reg ? '<p class="aiuto">Da 3 a 20 caratteri: lettere, numeri, punto, trattino o trattino basso.</p>' : '') + '</div>' +
      campoPw('acc-p', 'Password', reg ? 'new-password' : 'current-password', reg ? 'Almeno 6 caratteri.' : '') +
      (reg ? campoPw('acc-p2', 'Ripeti la password', 'new-password', '') +
        '<div class="campo"><label class="fl" for="acc-c">Codice d\'accesso</label><input class="in codice" id="acc-c" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" required><p class="aiuto">Te lo dà un amministratore.</p></div>' : '') +
      '<p class="err" role="alert"></p><button type="submit" class="btn">' + (reg ? 'Crea l\'account' : 'Entra') + '</button>' +
      (reg ? '<details class="tos-reg"><summary>Creando l\'account accetti i <u>termini di servizio</u></summary>' + TERMINI + '</details>' : '') + '</form>' +
      '<p class="nota">' + (reg ? 'Senza email la password non si recupera da soli: se la dimentichi, chiedi all\'amministratore di cambiartela.' : 'Non hai un account? Tocca <b>Registrati</b>: ti serve il codice d\'accesso.') + '</p></div>';
    if (avviso) $('.avviso', GT).textContent = avviso;
    collegaOcchi(GT);
    GT.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { if (scheda === b.dataset.s) return; scheda = b.dataset.s; avviso = ''; disegnaGate(); $('#acc-u', GT).focus(); }));
    const f = $('form', GT), e = $('.err', f), btn = $('button[type=submit]', f);
    f.addEventListener('submit', async ev => {
      ev.preventDefault(); e.textContent = '';
      const u = $('#acc-u', f).value, pw = $('#acc-p', f).value;
      if (!u.trim() || !pw) { e.textContent = 'Scrivi nome utente e password.'; return; }
      if (reg && pw !== $('#acc-p2', f).value) { e.textContent = 'Le due password non coincidono: tocca l\'occhio per controllarle.'; return; }
      if (reg && !$('#acc-c', f).value.trim()) { e.textContent = 'Scrivi il codice d\'accesso: te lo dà un amministratore.'; $('#acc-c', f).focus(); return; }
      btn.disabled = true; btn.textContent = reg ? 'Creo l\'account…' : 'Accesso…';
      try { reg ? await registra(u, pw, $('#acc-c', f).value) : await entra(u, pw); avviso = ''; scheda = 'entra'; }
      catch (x) { e.textContent = x.message || 'Qualcosa non ha funzionato: riprova.'; btn.disabled = false; btn.textContent = reg ? 'Crea l\'account' : 'Entra'; }
    });
  }
  /* mostra o toglie la schermata d'accesso */
  function porta(){
    const s = sess(), era = !GT.hidden;
    document.documentElement.classList.toggle('qp-ok', !!s);
    if (s) { if (era) { GT.hidden = true; GT.innerHTML = ''; } return; }
    if (!era) { GT.hidden = false; disegnaGate(); }
    else if (!GT.firstChild) disegnaGate();
  }
  function rotta(){
    const on = location.hash === '#profilo' && !!sess();
    if (on) { if (P.hidden) { P.hidden = false; document.body.classList.add('acc-aperto'); } disegna(); $('.x', P).focus(); }
    else if (!P.hidden) { P.hidden = true; document.body.classList.remove('acc-aperto'); }
  }
  addEventListener('hashchange', rotta);

  /* ---------- aggiorna tutto quando cambia qualcosa ---------- */
  function aggiorna(){
    const s = sess();
    const r = ruoloDi(s);
    porta();
    chip.classList.toggle('in', !!s); chip.classList.toggle('ad', r === 'admin'); chip.classList.toggle('sa', r === 'superadmin');
    const av = $('.av', chip); if (s) { avatar(av, s.nome, foto.mia(), ''); } else { av.innerHTML = ICO.utente; }
    $('.nm', chip).textContent = s ? s.nome : '';
    chip.setAttribute('aria-label', s ? 'Profilo di ' + s.nome + (r ? ' (' + NOME_RUOLO[r] + ')' : '') : 'Profilo');
    Object.keys(tasti).forEach(id => {
      const b = tasti[id], on = !!s && prog.fatti.has(id);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      $('.tx', b).textContent = on ? 'Letto' : 'Segna come letto';
    });
    document.querySelectorAll('.toc a').forEach(a => {
      const id = (a.getAttribute('href') || '').replace(/^#/, ''); if (!tasti[id]) return;
      let tk = $('.tk', a); const on = !!s && prog.fatti.has(id);
      if (on && !tk) { tk = document.createElement('span'); tk.className = 'tk'; tk.innerHTML = ICO.ok; tk.setAttribute('role', 'img'); tk.setAttribute('aria-label', 'letto'); const ult = a.lastElementChild; ult && ult !== a.firstElementChild ? a.insertBefore(tk, ult) : a.append(tk); }
      else if (!on && tk) tk.remove();
    });
    document.querySelectorAll('#cards .card[data-sec]').forEach(c => {
      const sz = SEZ.find(x => x.id === c.dataset.sec); let pr = $('.pr', c);
      if (!s || !sz) { if (pr) pr.remove(); c.classList.remove('con-pr'); return; }
      const n = conta(sz.art), t = sz.art.length, p = pc(n, t);
      if (!pr) { pr = document.createElement('span'); pr.className = 'pr'; pr.innerHTML = '<span class="bar"><i></i></span><span class="pr-n"></span>'; c.append(pr); }
      c.classList.add('con-pr'); $('.bar', pr).classList.toggle('ok', p === 100); $('.bar i', pr).style.width = p + '%';
      $('.pr-n', pr).textContent = n + '/' + t + ' · ' + p + '%';
    });
    const hd = $('#home .how-card .d'); if (hd) hd.textContent = 'Sezioni, audio delle lezioni, ricerca, profilo e progressi, uso senza internet e installazione.';
    if (!P.hidden) { if (s) disegna(); else chiudi(); }
  }
  subs.push(aggiorna);

  /* ---------- per gli altri moduli (segnalazioni) ---------- */
  window.QP = {CFG, DEMO, H, rest, rpc, token, sessione: sess, ruolo, NOME_RUOLO, avatar, TERMINI, foto: () => foto.mia(),
    admin: () => ruolo() === 'admin' || ruolo() === 'superadmin',       // può aprire l'area admin (utenti)
    superadmin: () => ruolo() === 'superadmin',                           // accessi, segnalazioni, elimina account
    nome: () => { const s = sess(); return s ? s.nome : ''; },
    on: f => subs.push(f), apriProfilo: apri, nuove: 0, ridisegna: () => { if (!P.hidden) disegna(); }, CODICE_DEMO};

  aggiorna(); rotta();
  if (sess() && !DEMO) { prog.scarica().then(aggiorna); battito.avvia(); }
})();
</script>
