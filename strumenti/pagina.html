      '<path class="il-b" d="M18 44H40M18 60H40"/><path class="il-t" d="M44 52H58"/><circle class="il-ink" cx="51" cy="47" r="1.8"/><circle class="il-ink" cx="51" cy="57" r="1.8"/>' +

      '<g transform="rotate(4 48 40)"><path class="il-fs" d="M8 26H88L82 44Q80 50 72 50H22Q14 50 12 44Z"/><path d="M8 26H88L82 44Q80 50 72 50H22Q14 50 12 44Z"/>' +

    carteggio:
      '<path class="il-t" style="opacity:.3" d="M4 16H92M4 36H92M4 56H92M24 4V68M48 4V68M72 4V68"/>' +
      '<path class="il-land" d="M96 0V30Q86 28 80 20T66 8T58 0Z"/><path class="il-t" d="M96 30Q86 28 80 20T66 8T58 0"/>' +
      '<path class="il-gold" d="M78 14l2-6 2 6z"/>' +
      '<path class="il-a" d="M10 62L60 26"/><path class="il-a" d="M54 27l6-1-2 6"/>' +
      '<circle class="il-fs" cx="10" cy="62" r="3.6"/><circle class="il-b" cx="10" cy="62" r="3.6"/>' +
      '<path style="stroke-width:2.4" d="M40 8L30 46M40 8L52 44"/><circle class="il-fs" cx="40" cy="8" r="3"/><circle cx="40" cy="8" r="3"/>' +
      '<path class="il-t" d="M30 46l-1 4M52 44l1.5 3.8"/>'
  };
  const PER_TITOLO = {'Astronomia':'astronomia','Maree':'maree','Stabilità':'stabilita','Meteorologia':'meteorologia','Manovrabilità':'manovrabilita','Navigazione e cartografia':'navigazione','Strumenti di navigazione':'girobussola','Convenzioni':'convenzioni','Formulario':'formulario'};
  const disegno = id => { const s = document.createElement('span'); s.className = 'ill'; s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<svg viewBox="0 0 96 72">' + D[id] + '</svg>'; return s; };
  document.querySelectorAll('#cards .card').forEach(c => {
    const n = c.querySelector('.n'); const id = n && PER_TITOLO[n.textContent.trim()];
    if (id && D[id]) { c.dataset.sec = id; c.append(disegno(id)); }
  });

  // scritte sotto la casetta e sotto il tasto del tema
  const hb = document.getElementById('homeBtn');
  if (hb && !hb.querySelector('.tcap')) hb.insertAdjacentHTML('beforeend', '<span class="tcap">Home</span>');
  const tb = document.getElementById('themeBtn');
  if (tb && !tb.querySelector('.tcap')) tb.insertAdjacentHTML('beforeend', '<span class="tcap tcap-l">Light mode</span><span class="tcap tcap-d">Dark mode</span>');

  // esercizi: pagine a parte (assetto/, carteggio/), si aprono come pagine nuove e tornano qui con "‹ Quaderno Patentino"
  function esercizi(){
    const sec = document.createElement('section'); sec.className = 'eser'; sec.setAttribute('aria-labelledby', 'eser-t');
    sec.innerHTML = '<h2 id="eser-t">Esercizi</h2><div class="eser-g">' +
      '<a class="eser-c" href="assetto/"><span class="n">Esercizi di stabilità</span><span class="m">Assetto e pescaggi</span><span class="d">Problemi del libro risolti passo per passo: densità, pesi, imbarco e sbarco, assetto voluto, punti neutri.</span></a>' +
      '<a class="eser-c" href="carteggio/"><span class="n">Carteggio</span><span class="m">Carta 5D</span><span class="d">Tavolo di carteggio con esercizi ministeriali, punto nave con rilevamenti, fari e correnti.</span></a></div>';
    const ill = {assetto: D.assetto, carteggio: D.carteggio};
    sec.querySelectorAll('.eser-c').forEach((a, i) => { const s = document.createElement('span'); s.className = 'ill'; s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<svg viewBox="0 0 96 72">' + (i ? ill.carteggio : ill.assetto) + '</svg>'; a.prepend(s); });
    return sec;
  }

  // istruzioni: riquadro come le sezioni; toccandolo si apre l'elenco
  const how = document.querySelector('#home .howto');
  if (how) {
    const h2 = how.querySelector('h2'), ol = how.querySelector('.how-corpo') || how.querySelector('ol');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'how-card';
    b.setAttribute('aria-expanded', 'false'); if (ol) { ol.id = ol.id || 'howto-lista'; b.setAttribute('aria-controls', ol.id); }

    if (ol) ol.hidden = true;
    const home = document.getElementById('home'); if (home) home.insertBefore(how, home.firstChild);
    if (home) how.after(esercizi());
    b.addEventListener('click', () => { const apri = ol.hidden; ol.hidden = !apri; b.setAttribute('aria-expanded', apri ? 'true' : 'false'); });

})();
</script>
